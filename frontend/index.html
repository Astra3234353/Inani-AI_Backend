<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Video Upload - Mock Frontend</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }
        
        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }
        
        .upload-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .file-info {
            margin: 20px 0;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 10px;
            display: none;
        }
        
        .file-info.show {
            display: block;
        }
        
        .file-name {
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 5px;
        }
        
        .file-size {
            color: #558b2f;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .response {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
        
        .response.show {
            display: block;
        }
        
        .response.success {
            background: #e8f5e9;
            border: 2px solid #4caf50;
        }
        
        .response.error {
            background: #ffebee;
            border: 2px solid #f44336;
        }
        
        .response-title {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .response.success .response-title {
            color: #2e7d32;
        }
        
        .response.error .response-title {
            color: #c62828;
        }
        
        .response-content {
            font-size: 14px;
            line-height: 1.6;
        }
        
        .ai-results {
            margin-top: 15px;
            padding: 15px;
            background: #f0f7ff;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .detected-word {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            text-align: center;
            margin: 15px 0;
            padding: 20px;
            background: white;
            border-radius: 10px;
            letter-spacing: 5px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }
        
        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        
        .predictions-list {
            margin-top: 15px;
        }
        
        .prediction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: white;
            border-radius: 5px;
            margin-bottom: 8px;
        }
        
        .prediction-letter {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #667eea;
            color: white;
            border-radius: 8px;
        }
        
        .prediction-confidence {
            flex: 1;
            margin-left: 15px;
        }
        
        .confidence-bar {
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }
        
        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
            color: white;
            font-size: 11px;
            font-weight: bold;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤟 ASL Video Upload</h1>
        <p class="subtitle">Mock Frontend para probar tu API de Django</p>
        
        <form id="uploadForm">
            <div class="form-group">
                <label for="apiUrl">URL de tu API Django:</label>
                <input 
                    type="text" 
                    id="apiUrl" 
                    value="http://localhost:8000/api/upload-video/" 
                    placeholder="http://localhost:8000/api/upload-video/"
                >
            </div>
            
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">🎥</div>
                <p><strong>Haz clic aquí o arrastra un video</strong></p>
                <p style="font-size: 12px; color: #666; margin-top: 10px;">
                    Formatos: MP4, MOV, WebM, AVI
                </p>
                <input type="file" id="videoInput" accept="video/*">
            </div>
            
            <div class="file-info" id="fileInfo">
                <div class="file-name" id="fileName"></div>
                <div class="file-size" id="fileSize"></div>
            </div>
            
            <button type="submit" class="btn" id="submitBtn" disabled>
                Subir Video
            </button>
        </form>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Enviando video...</p>
        </div>
        
        <div class="response" id="response">
            <div class="response-title" id="responseTitle"></div>
            <div class="response-content" id="responseContent"></div>
        </div>
    </div>
    
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const videoInput = document.getElementById('videoInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const submitBtn = document.getElementById('submitBtn');
        const uploadForm = document.getElementById('uploadForm');
        const loading = document.getElementById('loading');
        const response = document.getElementById('response');
        const responseTitle = document.getElementById('responseTitle');
        const responseContent = document.getElementById('responseContent');
        const apiUrl = document.getElementById('apiUrl');
        
        let selectedFile = null;
        
        // Click en el área de upload
        uploadArea.addEventListener('click', () => {
            videoInput.click();
        });
        
        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelect(files[0]);
            }
        });
        
        // Selección de archivo
        videoInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });
        
        function handleFileSelect(file) {
            if (!file.type.startsWith('video/')) {
                alert('Por favor selecciona un archivo de video');
                return;
            }
            
            selectedFile = file;
            
            // Mostrar información del archivo
            fileName.textContent = `📁 ${file.name}`;
            const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
            fileSize.textContent = `📊 Tamaño: ${sizeMB} MB`;
            
            fileInfo.classList.add('show');
            submitBtn.disabled = false;
            response.classList.remove('show');
        }
        
        // Enviar formulario
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!selectedFile) {
                alert('Por favor selecciona un video primero');
                return;
            }
            
            // Mostrar loading
            loading.classList.add('show');
            submitBtn.disabled = true;
            response.classList.remove('show');
            
            // Crear FormData
            const formData = new FormData();
            formData.append('video', selectedFile);
            
            try {
                const res = await fetch(apiUrl.value, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await res.json();
                
                // Ocultar loading
                loading.classList.remove('show');
                
                // Mostrar respuesta
                response.classList.add('show');
                
                if (res.ok && data.success) {
                    response.classList.remove('error');
                    response.classList.add('success');
                    responseTitle.textContent = '✅ ' + data.message;
                    
                    let contentHTML = `
                        <strong>📁 Información del video:</strong><br>
                        Nombre: ${data.video_info.filename}<br>
                        Tamaño: ${data.video_info.size_mb} MB<br>
                        Formato: ${data.video_info.format}<br>
                    `;
                    
                    // Mostrar resultados de IA si existen
                    if (data.ai_results) {
                        const aiResults = data.ai_results;
                        
                        contentHTML += `
                            <div class="ai-results">
                                <strong>🤖 Resultados del Análisis con IA:</strong>
                                
                                ${aiResults.detected_word ? `
                                    <div class="detected-word">
                                        ${aiResults.detected_word || '(ninguna letra detectada)'}
                                    </div>
                                ` : '<p style="text-align: center; color: #999; margin: 15px 0;">No se detectaron letras con suficiente confianza</p>'}
                                
                                <div class="stats">
                                    <div class="stat-card">
                                        <div class="stat-value">${aiResults.frames_analyzed || 0}</div>
                                        <div class="stat-label">Frames Analizados</div>
                                    </div>
                                    <div class="stat-card">
                                        <div class="stat-value">${aiResults.total_predictions || 0}</div>
                                        <div class="stat-label">Predicciones Válidas</div>
                                    </div>
                                    <div class="stat-card">
                                        <div class="stat-value">${Math.round((aiResults.confidence_threshold || 0) * 100)}%</div>
                                        <div class="stat-label">Umbral de Confianza</div>
                                    </div>
                                </div>
                                
                                ${aiResults.predictions && aiResults.predictions.length > 0 ? `
                                    <div class="predictions-list">
                                        <strong>📊 Predicciones Detalladas:</strong>
                                        ${aiResults.predictions.map((pred, index) => `
                                            <div class="prediction-item">
                                                <div class="prediction-letter">${pred.letter}</div>
                                                <div class="prediction-confidence">
                                                    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #666;">
                                                        <span>Letra ${index + 1}</span>
                                                        <span>${Math.round(pred.confidence * 100)}%</span>
                                                    </div>
                                                    <div class="confidence-bar">
                                                        <div class="confidence-fill" style="width: ${pred.confidence * 100}%">
                                                            ${pred.confidence >= 0.3 ? Math.round(pred.confidence * 100) + '%' : ''}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    }
                    
                    responseContent.innerHTML = contentHTML;
                } else {
                    response.classList.remove('success');
                    response.classList.add('error');
                    responseTitle.textContent = '❌ Error';
                    
                    let errorHTML = `<strong>Detalles del error:</strong><br>${data.error || 'Ocurrió un error desconocido'}`;
                    
                    // Mostrar información del video si existe
                    if (data.video_info) {
                        errorHTML += `<br><br><strong>Video recibido:</strong><br>
                            📁 ${data.video_info.filename}<br>
                            📊 ${data.video_info.size_mb} MB`;
                    }
                    
                    responseContent.innerHTML = errorHTML;
                }
                
                submitBtn.disabled = false;
                
            } catch (error) {
                loading.classList.remove('show');
                response.classList.add('show');
                response.classList.remove('success');
                response.classList.add('error');
                responseTitle.textContent = '❌ Error de Conexión';
                responseContent.innerHTML = `
                    <strong>No se pudo conectar con el servidor:</strong><br>
                    ${error.message}<br><br>
                    <strong>Posibles causas:</strong><br>
                    • El servidor Django no está corriendo<br>
                    • La URL de la API es incorrecta<br>
                    • Problemas de CORS (necesitas configurar django-cors-headers)
                `;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
